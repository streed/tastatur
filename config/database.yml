# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

  variables:
    # A ceiling on how long any one statement may run.
    #
    # Dashboard queries scan the raw hypertable whenever a filter is applied or the
    # site's timezone does not align to the aggregate buckets, and that cost grows
    # with the site's event count. Without a timeout, one expensive report holds a
    # connection until it finishes — and with a small pool, a handful of those is
    # the whole pool. The request has usually been abandoned by the browser long
    # before the query gives up.
    #
    # Fifteen seconds is far above any healthy dashboard query (the slowest measured
    # is around two seconds, on 1.5M events with a non-UTC timezone) and far below
    # the point at which a stuck connection matters.
    #
    # THE WORKER MUST SET THIS TO 0. `refresh_continuous_aggregate` over a wide
    # window and the nightly retention delete across compressed chunks both run for
    # minutes by design; killing them would leave aggregates unreconciled after an
    # erasure, which is a privacy claim rather than a slow page. Both compose files
    # set DB_STATEMENT_TIMEOUT=0 on the worker for that reason.
    statement_timeout: <%= ENV.fetch("DB_STATEMENT_TIMEOUT", "15s") %>


development:
  <<: *default
  database: tastatur_development

  # The specified database role being used to connect to PostgreSQL.
  # To create additional roles in PostgreSQL see `$ createuser --help`.
  # When left blank, PostgreSQL will use the default role. This is
  # the same name as the operating system user running Rails.
  #username: tastatur

  # The password associated with the PostgreSQL role (username).
  #password:

  # Connect on a TCP socket. Omitted by default since the client uses a
  # domain socket that doesn't need configuration. Windows does not have
  # domain sockets, so uncomment these lines.
  #host: localhost

  # The TCP port the server listens on. Defaults to 5432.
  # If your server runs on a different port number, change accordingly.
  #port: 5432

  # Schema search path. The server defaults to $user,public
  #schema_search_path: myapp,sharedapp,public

  # Minimum log levels, in increasing order:
  #   debug5, debug4, debug3, debug2, debug1,
  #   log, notice, warning, error, fatal, and panic
  # Defaults to warning.
  #min_messages: notice

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: tastatur_test

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# If the connection URL is provided in the special DATABASE_URL environment
# variable, Rails will automatically merge its configuration values on top of
# the values provided in this file. Alternatively, you can specify a connection
# URL environment variable explicitly:
#
#   production:
#     url: <%= ENV["MY_APP_DATABASE_URL"] %>
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
# Configured entirely by DATABASE_URL, which Rails merges over whatever is here.
#
# The generated template left `username: tastatur` and a TASTATUR_DATABASE_PASSWORD
# lookup behind. No such role is ever created, that variable appears in no compose
# file, env example or document, and it only ever worked because DATABASE_URL
# overrode it. Someone deploying against a managed PostgreSQL with PGHOST/PGUSER
# set and no DATABASE_URL got `ActiveRecord::DatabaseConnectionError ... username:
# tastatur` — and libpq's PGUSER cannot rescue it, because an explicit `username`
# here wins.
#
# Deliberately NOT `url: <%%= ENV.fetch("DATABASE_URL") %>`: the Dockerfile runs
# `assets:precompile` with RAILS_ENV=production and no DATABASE_URL, so the fetch
# raises KeyError and the image cannot be built. bin/docker-entrypoint is the right
# place for a required-variable check, since it never runs during precompilation.
#
# `seeds: false` is a security control, not tidiness. `db:prepare` seeds a database
# it has just created, and db/seeds.rb creates admin@example.com / password with
# admin = true. This is the second of two independent guards; the other is the
# environment check at the top of db/seeds.rb.
production:
  <<: *default
  database: tastatur_production
  seeds: false
