# sidekiq-cron schedule.
#
# One of these is load-bearing for the privacy guarantees rather than being
# housekeeping: if retention enforcement stops, we hold data longer than we told
# people we would. That is worth alerting on, not silently retrying.
#
# Salt rotation is deliberately NOT here. It used to be, at 04:07 server time,
# which was both the wrong moment — a reporting day runs midnight to midnight in
# the site's own timezone, so a fixed UTC rotation cut through the middle of it
# and counted one visitor twice — and the wrong mechanism, since a job that
# silently stopped left the product no longer anonymous with nothing raised.
# Each site's salt is now keyed by its site-local date and retires on its own
# TTL, so rotation is a property of the clock. See Ingest::SaltStore.

flush_event_buffer:
  cron: "* * * * *"
  class: "FlushEventBufferJob"
  queue: within_30_seconds
  description: >
    Backstop for the size-triggered flush. The ingest path enqueues a flush once
    the buffer passes its threshold, so on a busy site this usually finds an
    empty buffer and returns immediately. It exists for the quiet site whose
    buffer would otherwise sit unflushed between visits.

enforce_data_retention:
  cron: "23 3 * * *"
  class: "EnforceDataRetentionJob"
  queue: within_1_hour
  description: >
    Deletes events past each account's retention window, then reconciles the
    aggregates the deletion invalidated. 03:23 is near the global traffic trough,
    and the odd minute avoids the thundering herd of every cron job on the box
    firing at once.

reconcile_usage:
  cron: "13 * * * *"
  class: "ReconcileUsageJob"
  queue: within_5_minutes
  description: >
    Repairs each account's monthly event counter from the events_by_hour
    aggregate, then warns anyone near or past their plan's allowance. Hourly
    rather than nightly because the counter it repairs is what decides whether an
    event is recorded: enforcement reads Redis, Redis loses counts, and every
    count lost is quota given away with nothing to show it happened.

reconcile_subscriptions:
  cron: "41 4 * * *"
  class: "ReconcileSubscriptionsJob"
  queue: within_1_hour
  description: >
    Re-reads every known Stripe subscription and applies what it finds, and prunes
    webhook receipts older than 30 days. The backstop for webhooks Stripe gave up
    delivering, or that arrived while the endpoint was misconfigured — both of
    which leave an account on the wrong plan with nothing raised. 04:41, well
    after retention enforcement, so the two nightly sweeps do not overlap.
