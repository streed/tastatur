# Referrer host -> human-readable source name, plus the channel it belongs to.
#
# Hand-maintained rather than vendored from Matomo or Snowplow: those lists are
# thousands of entries covering search engines that no longer exist, and they
# carry their own licences. This covers the traffic sources a real site
# actually sees, and unknown hosts fall through to "Referral" with the bare
# hostname as the label, which is a perfectly good answer.
#
# Matching is on the registrable domain with any leading "www." removed, and
# any subdomain also matches its parent entry (news.google.com -> google.com).

