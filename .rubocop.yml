# Omakase Ruby styling for Rails, with one house deviation.
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Use `[a, [b, c]]`, not `[ a, [ b, c ] ]`.
#
# This is the override the generated config suggests in its own comment, and it
# is taken deliberately rather than by neglect: the codebase is written in the
# tighter style throughout, so enforcing omakase here would mean reformatting 50
# files into a style nothing in the project actually uses.
Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: false
