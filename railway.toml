# Railway configuration for the WEB service.
#
# Config-as-code overrides the dashboard, so this file is the source of truth for
# anything it declares. That cuts both ways: the worker is a SECOND Railway service
# built from this same repository, and it must NOT pick this file up, or it would
# inherit the start command below and come up as another web server with Sidekiq
# running nowhere.
#
# So the worker points at `railway.worker.toml` via its `railwayConfigFile` setting.
# See that file and docs/self-hosting/railway.md.
#
# Ports: Railway injects PORT. bin/docker-entrypoint bridges it to Thruster's
# HTTP_PORT, so nothing needs setting in the dashboard for the app to bind
# correctly. Thruster then starts Puma on its own TARGET_PORT.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "./bin/thrust ./bin/rails server"

# Migrations run here, NOT from bin/docker-entrypoint.
#
# The entrypoint only runs db:prepare when the container's last two arguments are
# exactly `./bin/rails server`. That holds for `docker compose`, which passes the
# command as an argv list. Railway wraps the start command in a shell, so the
# entrypoint actually receives ["/bin/sh", "-c", "./bin/thrust ./bin/rails server"]
# — the condition sees "-c" and never fires.
#
# The result was a deployment that looked healthy in the logs (Thruster up, Puma
# listening) and failed its health check, because /up checks the database and the
# database had no schema. Railway then tore the deployment down and the edge
# answered "Application not found", which points nowhere near the cause.
#
# preDeployCommand is the right mechanism regardless: it runs once before the new
# deployment takes traffic, rather than once per replica at boot.
preDeployCommand = "bin/rails db:prepare"

# Railway waits for a 200 here before shifting traffic to a new deploy.
#
# /up checks PostgreSQL and BOTH Redis instances and returns 503 if any is down.
# The privacy Redis is included deliberately: without it ingest cannot compute a
# visitor identity at all, so a deploy that came up without it would accept
# requests and quietly drop every event.
healthcheckPath = "/up"
healthcheckTimeout = 120

# Analytics ingest is fire-and-forget from a beacon that cannot retry, so a
# restart loop loses data rather than deferring it.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

numReplicas = 1
