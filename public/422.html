<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>That request was rejected (422) · Tastatur</title>
    <meta name="robots" content="noindex">
    <style>
      /* Self-contained on purpose: this page is served when the application
         cannot be, so it cannot rely on the asset pipeline or the webfont. */
      :root {
        --paper: #f2f1ec; --surface: #fcfcfa; --ink: #16150f;
        --ink-2: #57564e; --muted: #6d6b62; --rule: #e3e1d8; --signal: #c1440e;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--paper); color: var(--ink);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 15px; line-height: 1.55;
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        background: var(--surface); border: 1px solid var(--rule);
        max-width: 30rem; width: 100%; padding: 40px;
      }
      .code {
        font-size: 10px; font-weight: 600; letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
      }
      h1 {
        font-size: 21px; font-weight: 600; letter-spacing: -0.018em;
        line-height: 1.15; margin-bottom: 14px;
      }
      p { color: var(--ink-2); margin-bottom: 14px; }
      .hint { font-size: 13px; color: var(--muted); }
      .actions { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--rule); }
      a {
        color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600;
        border: 1px solid var(--ink); padding: 9px 16px; display: inline-block;
      }
      a:hover { background: var(--ink); color: var(--surface); }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #16150f; --surface: #1e1d16; --ink: #f2f1ec;
          --ink-2: #c6c3b7; --muted: #8c8a80; --rule: #33312a;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code">Error 422</p>
      <h1>That request was rejected</h1>
      <p>The change could not be applied. This usually means a form was left open long enough for its security token to expire.</p>
      <p class="hint">Go back, reload the page, and try again.</p>
      <div class="actions"><a href="/">Back to Tastatur</a></div>
    </main>
  </body>
</html>
